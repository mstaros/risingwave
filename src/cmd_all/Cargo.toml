[package]
name = "risingwave_cmd_all"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    "workspace-hack",
    "workspace-config",
    "task_stats_alloc",
    "tikv-jemallocator",
    "risingwave_connector",
]

[package.metadata.cargo-udeps.ignore]
ignored = [
    "workspace-hack",
    "workspace-config",
    "task_stats_alloc",
    "tikv-jemallocator",
    "risingwave_connector",
]

[features]
kafka = [
    "risingwave_cmd/kafka",
    "risingwave_connector/kafka",
    "risingwave_compute/kafka",
    "risingwave_frontend/kafka",
    "risingwave_ctl/kafka",
]
faiss = [
    "risingwave_cmd/faiss",
    "risingwave_common/faiss",
    "risingwave_connector/faiss",
    "risingwave_compute/faiss",
    "risingwave_frontend/faiss",
    "risingwave_ctl/faiss",
]
java = [
    "dep:risingwave_jni_core",
    "risingwave_cmd/java",
    "risingwave_common/java",
    "risingwave_compute/java",
    "risingwave_connector/java",
    "risingwave_ctl/java",
    "risingwave_frontend/java",
]
default = ["rw-static-link", "all-connectors", "java", "kafka", "faiss"]
rw-static-link = ["workspace-config/rw-static-link"]
rw-dynamic-link = ["workspace-config/rw-dynamic-link"]
openssl-vendored = ["workspace-config/openssl-vendored"]
udf = ["risingwave_expr_impl/udf"]
fips = ["workspace-config/fips"]
all-connectors = ["risingwave_connector/all-sinks-heavy", "all-connectors-lite"]
all-connectors-lite = [
    "risingwave_connector/all-sinks-lite",
    "risingwave_connector/all-sources",
    "risingwave_compute/all-sources",
    "risingwave_frontend/all-sources",
]
datafusion = ["risingwave_frontend/datafusion"]

[dependencies]
clap = { workspace = true }
console = "0.16"
const-str = "1.1"
home = "0.5"
risingwave_batch_executors = { workspace = true }
risingwave_cmd = { workspace = true }
risingwave_common = { workspace = true }
risingwave_compactor = { workspace = true }
risingwave_compute = { workspace = true }
# put here just to tweak feature flags
risingwave_connector = { workspace = true }
risingwave_ctl = { workspace = true }
risingwave_expr_impl = { workspace = true }
risingwave_frontend = { workspace = true }
risingwave_jni_core = { workspace = true, optional = true }
risingwave_meta_node = { workspace = true }
risingwave_rt = { workspace = true }
shell-words = "1.1.0"
strum = "0.28"
strum_macros = "0.28"
tikv-jemallocator = { workspace = true, features = [
    "unprefixed_malloc_on_supported_platforms",
] }
tokio = { workspace = true, features = ["fs"] }
tracing = { version = "0.1" }
workspace-config = { path = "../utils/workspace-config" }
workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
expect-test = "1"

[build-dependencies]
thiserror-ext = { workspace = true }
vergen = { version = "8", default-features = false, features = [
    "build",
    "git",
    "gitcl",
] }

[[bin]]
name = "risingwave"
path = "src/bin/risingwave.rs"
test = false

[lints]
workspace = true

[package]
name = "risingwave_cmd"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    "workspace-hack",
    "workspace-config",
    "task_stats_alloc",
    "tikv-jemallocator",
    "tokio",
]

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-hack", "workspace-config", "task_stats_alloc"]

[lib]
test = false

[features]
kafka = [
    "workspace-config/kafka",
    "risingwave_compute/kafka",
    "risingwave_frontend/kafka",
    "risingwave_ctl/kafka",
]
faiss = [
    "risingwave_common/faiss",
    "risingwave_compute/faiss",
    "risingwave_frontend/faiss",
    "risingwave_ctl/faiss",
]
java = [
    "risingwave_common/java",
    "risingwave_compute/java",
    "risingwave_ctl/java",
    "risingwave_frontend/java",
]
rw-static-link = ["workspace-config/rw-static-link"]
rw-dynamic-link = ["workspace-config/rw-dynamic-link"]
openssl-vendored = ["workspace-config/openssl-vendored"]
default = ["rw-static-link", "java", "kafka", "faiss"]
fips = ["workspace-config/fips"]

[dependencies]
clap = { workspace = true }
risingwave_batch_executors = { workspace = true }
risingwave_common = { workspace = true }
risingwave_compactor = { workspace = true }
risingwave_compute = { workspace = true }
risingwave_ctl = { workspace = true }
risingwave_expr_impl = { workspace = true }
risingwave_frontend = { workspace = true }
risingwave_meta_node = { workspace = true }
risingwave_rt = { workspace = true }
tokio = { workspace = true, features = ["fs", "tracing"] }

workspace-config = { path = "../utils/workspace-config" }
workspace-hack = { path = "../workspace-hack" }

[[bin]]
name = "risectl"
path = "src/bin/ctl.rs"
test = false

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { workspace = true, features = [
    "unprefixed_malloc_on_supported_platforms",
] }

[lints]
workspace = true

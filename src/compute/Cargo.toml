[package]
name = "risingwave_compute"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
kafka = [
    "risingwave_connector/kafka",
]
faiss = [
    "risingwave_common/faiss",
    "risingwave_connector/faiss",
    "risingwave_storage/faiss",
]
default = ["java", "kafka", "faiss"]
java = ["dep:risingwave_jni_core", "risingwave_common/java", "risingwave_connector/java"]
all-sources = ["risingwave_stream/all-sources"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
await-tree = { workspace = true }
clap = { workspace = true }
either = "1"
foyer = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-async-stream = { workspace = true }
itertools = { workspace = true }
maplit = "1.0.2"
prometheus = { version = "0.14" }
prost = { workspace = true }
risingwave_batch = { workspace = true }
risingwave_batch_executors = { workspace = true }
risingwave_common = { workspace = true }
risingwave_common_heap_profiling = { workspace = true }
risingwave_common_service = { workspace = true }
risingwave_connector = { workspace = true }
risingwave_dml = { workspace = true }
risingwave_hummock_sdk = { workspace = true }
risingwave_jni_core = { workspace = true, optional = true }
risingwave_pb = { workspace = true }
risingwave_rpc_client = { workspace = true }
risingwave_storage = { workspace = true }
risingwave_stream = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror-ext = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { version = "0.5", features = ["util", "load-shed"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
tikv-jemalloc-ctl = { workspace = true }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(not(madsim))'.dependencies]
workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
futures-async-stream = { workspace = true }
rand = { workspace = true }
risingwave_common_rate_limit = { workspace = true }
risingwave_hummock_sdk = { workspace = true }
risingwave_stream = { workspace = true, features = ["test"] }
tempfile = "3"
tokio-retry = "0.3"

[lints]
workspace = true
